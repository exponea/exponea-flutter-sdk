name: exponea_example
description: Bloomreach SDK demo app for the Exponea Flutter SDK.
version: 3.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  exponea:
    path: ../
  shared_preferences: ^2.1.1
  flutter_svg: '>=2.0.7 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  yaml: ^3.1.2
  mockito: ^5.4.4
  build_runner: ^2.4.9
  coverage: ^1.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
